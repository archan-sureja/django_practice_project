<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>Job Application Board</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
<link rel="stylesheet" href="https://cdn.datatables.net/1.10.24/css/dataTables.bootstrap4.min.css"/>
<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
<script src="https://cdn.datatables.net/1.10.24/js/jquery.dataTables.min.js"></script>
<script src="https://cdn.datatables.net/1.10.24/js/dataTables.bootstrap4.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body>
{% include 'common/message.html' %}

<div class="container mt-5">
    <p hidden id="user_id">{{user.id}}</p>
    <p hidden id="channel_name"></p>
    <h2>{% block heading %}{% endblock heading%}</h2>
    {% block content %} 
    {% endblock content %}
</div>
<script>
  
    function connect() {
        let user_id = document.getElementById("user_id").innerText
        console.log(user_id)
        const socket = new WebSocket("ws://localhost:8000/notify/applicant/"+user_id+"/");

        socket.onopen = () => {
            console.log("connected")
            console.log(user_id)
            socket.onmessage = (event)=>{
                payload = JSON.parse(event.data)
                if(payload && payload.action=="notification"){
                    window.alert(payload.message)
                }
            }

        };


        /*socket.onclose = () => {
            setTimeout(connect, 500); // reconnect
        };*/
    }
connect()
</script>
</body>
</html>
